name: Release APort Repository Guard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-verify-action-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.repository == 'aporthq/policy-verify-action'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git author
        run: |
          git config user.name "APort Release Bot"
          git config user.email "release@aport.io"

      - name: Validate action
        run: npm test

      - name: Create next patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          current_sha="$(git rev-parse HEAD)"
          semver_tags="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"
          latest_tag="$(printf "%s\n" "$semver_tags" | sed '/^$/d' | tail -n 1)"
          current_tag="$(git tag --points-at "$current_sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          is_latest_release="true"

          if [ -n "$current_tag" ]; then
            next_tag="$current_tag"
            if [ -n "$latest_tag" ] && [ "$current_tag" != "$latest_tag" ]; then
              is_latest_release="false"
              echo "Current commit already has historical release tag ${next_tag}; repairing artifacts without moving latest or stable aliases."
            else
              echo "Current commit already has latest release tag ${next_tag}; resuming release artifacts."
            fi
          else
            if [ -z "$latest_tag" ]; then
              next_tag="v1.0.0"
            else
              version="${latest_tag#v}"
              major="${version%%.*}"
              rest="${version#*.}"
              minor="${rest%%.*}"
              patch="${version##*.}"
              next_tag="v${major}.${minor}.$((patch + 1))"
            fi

            git tag -a "$next_tag" -m "Release ${next_tag}"
            git push origin "$next_tag"
            latest_tag="$next_tag"
            semver_tags="$(printf "%s\n%s\n" "$semver_tags" "$next_tag" | sed '/^$/d' | sort -V)"
          fi

          next_version="${next_tag#v}"
          major_tag="v${next_version%%.*}"
          minor_part="${next_version%.*}"
          minor_tag="v${minor_part}"
          previous_tag="$(printf "%s\n" "$semver_tags" | sed '/^$/d' | sort -Vu | awk -v target="$next_tag" '$0 == target { print previous; exit } { previous = $0 }')"

          {
            echo "## APort Repository Guard ${next_tag}"
            echo ""
            echo "Released from \`${GITHUB_REPOSITORY}@${GITHUB_SHA}\`."
            echo ""
            echo "### Changes"
            if [ -n "$previous_tag" ]; then
              git log "${previous_tag}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
            echo ""
            echo ""
            echo "Use this release with:"
            echo ""
            echo '```yaml'
            echo "uses: aporthq/policy-verify-action@${major_tag}"
            echo '```'
          } > release_notes.md

          if gh release view "$next_tag" >/dev/null 2>&1; then
            echo "Release ${next_tag} already exists."
            if [ "$is_latest_release" = "true" ]; then
              gh release edit "$next_tag" \
                --title "APort Repository Guard ${next_tag}" \
                --notes-file release_notes.md \
                --latest
            else
              gh release edit "$next_tag" \
                --title "APort Repository Guard ${next_tag}" \
                --notes-file release_notes.md
            fi
          else
            if [ "$is_latest_release" = "true" ]; then
              gh release create "$next_tag" \
                --title "APort Repository Guard ${next_tag}" \
                --notes-file release_notes.md \
                --latest
            else
              gh release create "$next_tag" \
                --title "APort Repository Guard ${next_tag}" \
                --notes-file release_notes.md \
                --latest=false
            fi
          fi

          if [ "$is_latest_release" != "true" ]; then
            echo "Skipping stable alias updates for historical release ${next_tag}."
            if [ -n "$latest_tag" ] && [ "$latest_tag" != "$next_tag" ] && gh release view "$latest_tag" >/dev/null 2>&1; then
              echo "Ensuring newest release ${latest_tag} remains marked latest."
              gh release edit "$latest_tag" --latest
            fi
            exit 0
          fi

          major_sha="$(git rev-parse -q --verify "refs/tags/${major_tag}^{commit}" 2>/dev/null || true)"
          if [ "$major_sha" != "$current_sha" ]; then
            git tag -f "$major_tag" "$current_sha"
            git push origin "refs/tags/${major_tag}" --force
          else
            echo "Alias ${major_tag} already points at ${current_sha}."
          fi

          minor_sha="$(git rev-parse -q --verify "refs/tags/${minor_tag}^{commit}" 2>/dev/null || true)"
          if [ "$minor_sha" != "$current_sha" ]; then
            git tag -f "$minor_tag" "$current_sha"
            git push origin "refs/tags/${minor_tag}" --force
          else
            echo "Alias ${minor_tag} already points at ${current_sha}."
          fi
