name: Release APort Repository Guard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-verify-action-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.repository == 'aporthq/policy-verify-action'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate action
        run: npm test

      - name: Create next patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          current_sha="$(git rev-parse HEAD)"
          if git tag --points-at "$current_sha" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Current commit already has a semver release tag; skipping."
            exit 0
          fi

          latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            next_tag="v1.0.0"
          else
            version="${latest_tag#v}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            patch="${version##*.}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          next_version="${next_tag#v}"
          major_tag="v${next_version%%.*}"
          minor_part="${next_version%.*}"
          minor_tag="v${minor_part}"

          {
            echo "## APort Repository Guard ${next_tag}"
            echo ""
            echo "Released from \`${GITHUB_REPOSITORY}@${GITHUB_SHA}\`."
            echo ""
            echo "### Changes"
            if [ -n "$latest_tag" ]; then
              git log "${latest_tag}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
            echo ""
            echo ""
            echo "Use this release with:"
            echo ""
            echo '```yaml'
            echo "uses: aporthq/policy-verify-action@${major_tag}"
            echo '```'
          } > release_notes.md

          git tag -a "$next_tag" -m "Release ${next_tag}"
          git push origin "$next_tag"

          gh release create "$next_tag" \
            --title "APort Repository Guard ${next_tag}" \
            --notes-file release_notes.md \
            --latest

          git tag -f "$major_tag" "$current_sha"
          git tag -f "$minor_tag" "$current_sha"
          git push origin "refs/tags/${major_tag}" --force
          git push origin "refs/tags/${minor_tag}" --force
