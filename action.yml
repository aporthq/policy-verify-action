name: "APort Repository Guard"
description: "APort AI agent passport guardrails for GitHub: hosted OAP decisions, PR attribution, and protected-path checks"
author: "APort Team"
branding:
  icon: "shield"
  color: "blue"

inputs:
  mode:
    description: "Verification mode: auto, hosted, local-json, or evidence-only. auto attempts hosted OIDC and falls back to evidence-only."
    required: false
    default: "auto"
  fallback-mode:
    description: "Fallback when auto hosted verification is unavailable. Currently supports evidence-only."
    required: false
    default: "evidence-only"
  api-url:
    description: "APort API base URL for hosted verification."
    required: false
    default: "https://api.aport.io"
  oidc-audience:
    description: "GitHub OIDC audience expected by the APort API."
    required: false
    default: "aport.io"
  passport-path:
    description: "Trusted OAP passport JSON path for local-json mode. Do not read this from untrusted PR head content."
    required: false
    default: ".aport/passport.json"
  protected-paths:
    description: "Comma-separated protected path globs. Defaults cover workflows, package manifests, and APort policy surfaces."
    required: false
    default: ""
  block-protected-paths:
    description: "Fail hosted verification when protected paths are changed. Keep false for low-friction rollout; set true for security-critical repos."
    required: false
    default: "false"

outputs:
  actor-class:
    description: "Classified PR actor: human, known_bot, coding_agent, unknown_automation, or unattributed"
    value: ${{ steps.aport.outputs.actor-class }}
  confidence:
    description: "Classification confidence"
    value: ${{ steps.aport.outputs.confidence }}
  provenance:
    description: "Authorization provenance for this repository verification"
    value: ${{ steps.aport.outputs.provenance }}
  structural-findings:
    description: "JSON array of structural repository findings"
    value: ${{ steps.aport.outputs.structural-findings }}
  decision-id:
    description: "APort decision ID when hosted or local-json verification returns one"
    value: ${{ steps.aport.outputs.decision-id }}
  outcome:
    description: "APort decision outcome when available"
    value: ${{ steps.aport.outputs.outcome }}

runs:
  using: "composite"
  steps:
    - name: APort / OAP code.repository.merge.v1
      id: aport
      shell: bash
      env:
        APORT_MODE: ${{ inputs.mode }}
        APORT_FALLBACK_MODE: ${{ inputs.fallback-mode }}
        APORT_API_URL: ${{ inputs.api-url }}
        APORT_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        APORT_PASSPORT_PATH: ${{ inputs.passport-path }}
        APORT_PROTECTED_PATHS: ${{ inputs.protected-paths }}
        APORT_BLOCK_PROTECTED_PATHS: ${{ inputs.block-protected-paths }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/src/index.js"
